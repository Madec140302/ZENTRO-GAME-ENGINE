<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZENTRO GAME ENGINE</title>

  <style>

    /* ================================
       PAGE
    ================================= */

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111111;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* ================================
       CANVAS 3D
    ================================= */

    #game {
      position: fixed;

      left: 0;
      top: 0;

      width: 100vw;
      height: 100vh;

      display: block;
    }


    /* ================================
       MESSAGE
    ================================= */

    #message {
      position: fixed;

      top: 20px;
      left: 20px;

      z-index: 100;

      padding: 14px 20px;

      border-radius: 10px;

      background: rgba(0, 0, 0, 0.85);

      color: white;

      font-size: 17px;
      font-weight: bold;

      box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.5);
    }

  </style>
</head>


<body>


  <!-- =================================
       MESSAGE DE TEST
  ================================== -->

  <div id="message">
    🚀 ZENTRO — Chargement du moteur 3D...
  </div>


  <!-- =================================
       CANVAS THREE.JS
  ================================== -->

  <canvas id="game"></canvas>


  <!-- =================================
       THREE.JS
  ================================== -->

  <script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>


  <!-- =================================
       MOTEUR ZENTRO
  ================================== -->

  <script>

    window.addEventListener("load", function () {

      const message =
        document.getElementById("message");


      /* ================================
         TEST THREE.JS
      ================================= */

      if (typeof THREE === "undefined") {

        message.textContent =
          "❌ THREE.JS N'EST PAS CHARGÉ";

        message.style.background =
          "rgba(150, 0, 0, 0.9)";

        return;
      }


      /* ================================
         TEST WEBGL
      ================================= */

      try {

        const testCanvas =
          document.createElement("canvas");

        const testContext =
          testCanvas.getContext("webgl") ||
          testCanvas.getContext(
            "experimental-webgl"
          );

        if (!testContext) {

          message.textContent =
            "❌ WEBGL N'EST PAS DISPONIBLE";

          message.style.background =
            "rgba(150, 0, 0, 0.9)";

          return;
        }


        /* ================================
           SCÈNE
        ================================= */

        const scene =
          new THREE.Scene();


        scene.background =
          new THREE.Color(0x202840);


        /* ================================
           CAMÉRA
        ================================= */

        const camera =
          new THREE.PerspectiveCamera(
            60,
            window.innerWidth /
            window.innerHeight,
            0.1,
            1000
          );


        camera.position.set(
          0,
          3,
          8
        );


        camera.lookAt(
          0,
          0,
          0
        );


        /* ================================
           RENDERER
        ================================= */

        const canvas =
          document.getElementById("game");


        const renderer =
          new THREE.WebGLRenderer({

            canvas: canvas,

            antialias: true,

            alpha: false

          });


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );


        renderer.setPixelRatio(
          Math.min(
            window.devicePixelRatio || 1,
            2
          )
        );


        /* ================================
           LUMIÈRE AMBIANTE
        ================================= */

        const ambientLight =
          new THREE.AmbientLight(
            0xffffff,
            1.5
          );


        scene.add(
          ambientLight
        );


        /* ================================
           LUMIÈRE PRINCIPALE
        ================================= */

        const directionalLight =
          new THREE.DirectionalLight(
            0xffffff,
            2
          );


        directionalLight.position.set(
          5,
          10,
          5
        );


        scene.add(
          directionalLight
        );


        /* ================================
           SOL
        ================================= */

        const groundGeometry =
          new THREE.PlaneGeometry(
            30,
            30
          );


        const groundMaterial =
          new THREE.MeshStandardMaterial({

            color: 0x444444

          });


        const ground =
          new THREE.Mesh(
            groundGeometry,
            groundMaterial
          );


        ground.rotation.x =
          -Math.PI / 2;


        ground.position.y = 0;


        scene.add(
          ground
        );


        /* ================================
           CUBE
        ================================= */

        const cubeGeometry =
          new THREE.BoxGeometry(
            2,
            2,
            2
          );


        const cubeMaterial =
          new THREE.MeshStandardMaterial({

            color: 0x00aaff

          });


        const cube =
          new THREE.Mesh(
            cubeGeometry,
            cubeMaterial
          );


        cube.position.y = 1;


        scene.add(
          cube
        );


        /* ================================
           PETITE LUMIÈRE SUR LE CUBE
        ================================= */

        const pointLight =
          new THREE.PointLight(
            0xffffff,
            10,
            20
          );


        pointLight.position.set(
          2,
          5,
          4
        );


        scene.add(
          pointLight
        );


        /* ================================
           ANIMATION
        ================================= */

        function animate() {

          requestAnimationFrame(
            animate
          );


          cube.rotation.y +=
            0.01;


          cube.rotation.x +=
            0.005;


          renderer.render(
            scene,
            camera
          );

        }


        /* ================================
           DÉMARRAGE
        ================================= */

        animate();


        /* ================================
           MESSAGE OK
        ================================= */

        message.textContent =
          "✅ ZENTRO 3D fonctionne !";


        message.style.background =
          "rgba(0, 110, 40, 0.9)";


        /* ================================
           REDIMENSIONNEMENT
        ================================= */

        window.addEventListener(
          "resize",
          function () {

            camera.aspect =
              window.innerWidth /
              window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
              window.innerWidth,
              window.innerHeight
            );

          }
        );


      }

      catch (error) {

        console.error(
          "ZENTRO ERROR:",
          error
        );


        message.textContent =
          "❌ ERREUR : " +
          error.message;


        message.style.background =
          "rgba(150, 0, 0, 0.9)";

      }

    });

  </script>

</body>
</html>
